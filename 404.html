<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost — Mission Journal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ctext%20x='16'%20y='22'%20font-family='monospace'%20font-size='15'%20text-anchor='middle'%20fill='%2314285a'%3E%5C%5BT%5D/%3C/text%3E%3C/svg%3E">
<!-- Self-contained so it renders at any URL depth; fonts load from the site root. -->
<style>
@font-face{font-family:"Quantico";font-weight:700;font-display:swap;src:url("/assets/fonts/quantico-700.woff2") format("woff2");}
@font-face{font-family:"Poppins";font-weight:400;font-display:swap;src:url("/assets/fonts/poppins-400.woff2") format("woff2");}
:root{--bg:#fff;--text:#000;--muted:#4a5468;--navy:#14285a;--rule:#dde2ec;
 --display:"Quantico","Arial Narrow",Arial,sans-serif;--sans:"Poppins","Segoe UI",system-ui,sans-serif;}
*{box-sizing:border-box;}
html{background:var(--bg);}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:1.0625rem;line-height:1.65;}
.bar{border-bottom:1px solid var(--rule);}
.box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2.5rem 1.25rem;}
.mark{font-family:var(--display);font-weight:700;color:var(--navy);font-size:clamp(2.5rem,12vw,4rem);margin:0 0 .75rem;}
h1{font-family:var(--display);font-weight:700;color:var(--navy);font-size:clamp(3.5rem,12vw,5rem);line-height:1;margin:0 0 .35rem;}
p{margin:0 0 .75rem;font-size:1.1rem;}
.sub{color:var(--muted);max-width:30rem;}
a{color:var(--navy);text-underline-offset:.2em;font-family:var(--display);font-weight:700;}
a:focus-visible{outline:2px solid var(--navy);outline-offset:3px;}
</style>
</head>
<body>
<div class="bar"></div>
<main class="box">
  <p class="mark" title="Praise the Sun" aria-hidden="true">\[T]/</p>
  <h1>404</h1>
  <p>This page is lost to the abyss.</p>
  <p class="sub">That link doesn&rsquo;t lead anywhere, but two years of letters are still right where you left them.</p>
  <p><a href="/">&larr; Praise the sun, head back</a></p>
</main>
</body>
</html>
